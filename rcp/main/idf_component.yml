## IDF Component Manager Manifest File
# ESP-IDF's ot_rcp example also depends on ot_examples_common,
# cmd_ieee802154_debug and esp-qa/coexist-cmd. They serve its spinel console,
# external coexistence and 802.15.4 debug options, which sdkconfig.defaults
# leaves off, so none of their code was linked. They are left out because the
# two ${IDF_PATH} components made dependencies.lock record a path that exists
# only on the machine that wrote it, and because the radio firmware then needs
# nothing from the component registry. Enabling one of those options needs
# them back.
dependencies:
  idf:
    version: "6.1.1"
