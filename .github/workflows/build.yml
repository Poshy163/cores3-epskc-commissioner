# Validates the display layout, rebuilds the firmware on every source push and
# publishes both update-safe component images and the compatibility merged image.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "firmware/**"
      - "README.md"
      - "launchpad.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The radio firmware's version string carries the time of the last
          # commit touching rcp/, which needs history beyond the tip.
          fetch-depth: 0

      - name: Test production parsers and failure paths on host
        run: python3 -B tools/run_host_tests.py --cc gcc

      - name: Check display layout
        run: python3 -B tools/layout_check.py "$RUNNER_TEMP/layout.svg"

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1.1
          target: esp32s3
          # The ESP32-H2 radio firmware (rcp/) builds first: the S3 image packs
          # it into the rcp_fw partition. Its version string is pinned (see
          # rcp/CMakeLists.txt), with the timestamp of rcp/'s last commit, so
          # CI and local builds of the same sources match and the device does
          # not reflash its radio for a rebuild.
          command: |
            set -e
            RCP_EPOCH=$(git log -1 --format=%ct -- rcp)
            RCP_EPOCH=${RCP_EPOCH:-$(git log -1 --format=%ct)}
            SOURCE_DATE_EPOCH=$RCP_EPOCH IDF_TARGET=esp32h2 idf.py -C rcp -B "$PWD/build-rcp" -D SDKCONFIG="$PWD/build-rcp/sdkconfig" -D RCP_SOURCE_DATE_EPOCH=$RCP_EPOCH build
            idf.py -B build -DRCP_BUILD_DIR="$PWD/build-rcp" build
            mkdir -p firmware
            cp build/bootloader/bootloader.bin firmware/bootloader.bin
            cp build/partition_table/partition-table.bin firmware/partition-table.bin
            cp build/epskc_commissioner.bin firmware/epskc-commissioner-app.bin
            cp build/rcp_fw.bin firmware/rcp-fw.bin
            cd build
            python -m esptool --chip esp32s3 merge_bin -o ../firmware/cores3-epskc-commissioner.bin @flash_args

      - name: Publish firmware images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/bootloader.bin \
            firmware/partition-table.bin \
            firmware/epskc-commissioner-app.bin \
            firmware/rcp-fw.bin \
            firmware/cores3-epskc-commissioner.bin
          git diff --cached --quiet && exit 0

          # Never attach artifacts built from an older revision to a newer one.
          # A push during the build starts a replacement run via concurrency.
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Branch moved; the newer workflow run will publish its artifacts."
            exit 0
          fi

          git commit -m "ci: rebuild firmware images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
