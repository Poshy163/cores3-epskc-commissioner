# Validates the display layout, rebuilds the firmware on every source push and
# publishes both update-safe component images and the compatibility merged image.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "firmware/**"
      - "README.md"
      - "launchpad.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check display layout
        run: python3 -B tools/layout_check.py "$RUNNER_TEMP/layout.svg"

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32s3
          command: |
            idf.py build
            mkdir -p firmware
            cp build/bootloader/bootloader.bin firmware/bootloader.bin
            cp build/partition_table/partition-table.bin firmware/partition-table.bin
            cp build/epskc_commissioner.bin firmware/epskc-commissioner-app.bin
            cd build
            python -m esptool --chip esp32s3 merge_bin -o ../firmware/cores3-epskc-commissioner.bin @flash_args

      - name: Publish firmware images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            firmware/bootloader.bin \
            firmware/partition-table.bin \
            firmware/epskc-commissioner-app.bin \
            firmware/cores3-epskc-commissioner.bin
          git diff --cached --quiet && exit 0

          # Never attach artifacts built from an older revision to a newer one.
          # A push during the build starts a replacement run via concurrency.
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Branch moved; the newer workflow run will publish its artifacts."
            exit 0
          fi

          git commit -m "ci: rebuild firmware images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
