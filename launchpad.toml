esp_toml_version = 1.0

# Raw-file URL of the firmware folder in this repo. Fix the username/branch if
# they differ from yours.
firmware_images_url = "https://raw.githubusercontent.com/Poshy163/cores3-epskc-commissioner/main/firmware/"

supported_apps = [
  "Factory install (resets settings)",
  "Update (keeps settings)",
]

["Factory install (resets settings)"]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "cores3-epskc-commissioner.bin"
offset = "0x0"
description = "Complete CoreS3 install. Replaces the bootloader and partition table, and clears saved Wi-Fi, Thread credentials and settings."
console_baudrate = 115200

["Update (keeps settings)"]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "epskc-commissioner-app.bin"
offset = "0x10000"
description = "App-only update for a CoreS3 already running this firmware with a compatible bootloader and partition layout. Keeps saved Wi-Fi, Thread credentials and settings."
console_baudrate = 115200
